{{- if .Values.crashLoop.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-troubleshooting-lab.fullname" . }}-crashloop
  namespace: {{ include "k8s-troubleshooting-lab.namespace" . }}
  labels:
    {{- include "k8s-troubleshooting-lab.labels" . | nindent 4 }}
    app.kubernetes.io/name: o9-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: o9-app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o9-app
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: o9-app
          image: {{ .Values.crashLoop.image | quote }}
          command: ["sh", "-c"]
          args:
            - >-
              echo {{ .Values.crashLoop.message | quote }};
              echo "Configuration file /etc/example/app.conf not found";
              sleep 3;
              exit 1
{{- end }}
