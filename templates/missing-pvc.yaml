{{- if .Values.mongoDb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-troubleshooting-lab.fullname" . }}-mongodb
  namespace: {{ include "k8s-troubleshooting-lab.namespace" . }}
  labels:
    {{- include "k8s-troubleshooting-lab.labels" . | nindent 4 }}
    app.kubernetes.io/name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongoDb.image | quote }}
          ports:
            - name: mongodb
              containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: {{ .Values.mongoDb.mountPath }}
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: {{ .Values.mongoDb.claimName }}
{{- end }}
