{{- if .Values.healthyNginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-troubleshooting-lab.fullname" . }}-nginx
  namespace: {{ include "k8s-troubleshooting-lab.namespace" . }}
  labels:
    {{- include "k8s-troubleshooting-lab.labels" . | nindent 4 }}
    app.kubernetes.io/name: nginx
spec:
  replicas: {{ .Values.healthyNginx.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.healthyNginx.image | quote }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-troubleshooting-lab.fullname" . }}-nginx
  namespace: {{ include "k8s-troubleshooting-lab.namespace" . }}
spec:
  selector:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.healthyNginx.servicePort }}
      targetPort: http
{{- end }}
