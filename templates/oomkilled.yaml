{{- if .Values.webapiapp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-troubleshooting-lab.fullname" . }}-oom
  namespace: {{ include "k8s-troubleshooting-lab.namespace" . }}
  labels:
    {{- include "k8s-troubleshooting-lab.labels" . | nindent 4 }}
    app.kubernetes.io/name: webapiapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapiapp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapiapp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: webapiapp
          image: {{ .Values.webapiapp.image | quote }}
          command: ["python", "-c"]
          args:
            - >-
              import time;
              print('Allocating memory above the container limit...', flush=True);
              x = bytearray({{ .Values.webapiapp.allocationMiB }} * 1024 * 1024);
              time.sleep(3600)
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: {{ .Values.webapiapp.memoryLimit }}
              cpu: 100m
{{- end }}
