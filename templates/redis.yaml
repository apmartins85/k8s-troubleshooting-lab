{{- if .Values.healthyRedis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-troubleshooting-lab.fullname" . }}-redis
  namespace: {{ include "k8s-troubleshooting-lab.namespace" . }}
  labels:
    {{- include "k8s-troubleshooting-lab.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.healthyRedis.image | quote }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep PONG"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-troubleshooting-lab.fullname" . }}-redis
  namespace: {{ include "k8s-troubleshooting-lab.namespace" . }}
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: {{ .Values.healthyRedis.servicePort }}
      targetPort: redis
{{- end }}
