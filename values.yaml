namespaceOverride: ""

healthyNginx:
  enabled: true
  replicas: 1
  image: nginx:1.27-alpine
  servicePort: 80

healthyRedis:
  enabled: true
  image: redis:7-alpine
  servicePort: 6379

o9app:
  enabled: true
  image: busybox:1.36
  message: "Simulated application startup failure"

webapiapp:
  enabled: true
  image: python:3.12-alpine
  memoryLimit: 32Mi
  allocationMiB: 128

mongoDb:
  enabled: true
  image: mongo:7
  claimName: mongodb-data-missing
  mountPath: /data/db
